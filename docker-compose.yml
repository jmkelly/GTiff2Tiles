services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: gtiff2tiles-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_FREE_DISK_THRESHOLD: "100MB"
    volumes:
      - /media/james/Local Disk 4/Code/s3:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/geotiff-storage --ignore-existing &&
      echo 'Bucket geotiff-storage created successfully.' &&
      exit 0
      "

